[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sliver-mcp"
version = "2.0.0-dev"
description = "Production-grade Sliver C2 MCP server with ATT&CK mapping, multi-session orchestration, engagement reporting, OPSEC guard, and operator playbooks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "sliver-py>=0.0.19",
    "mcp[cli]>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
sliver-mcp = "sliver_mcp.server:main"
sliver-mcp-legacy = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["sliver_mcp", "sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
